<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690" role="img" aria-label="Register map: PCA9555 input register bits carry the buttons, PCA9532 LS register fields drive the matching LEDs">
  <title>Register map - button bits and LED fields</title>
  <rect x="1" y="1" width="918" height="688" rx="14" fill="#ffffff" stroke="#ccd2da" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="32" y="40" font-size="20" font-weight="700" fill="#11161d">Register map</text>
    <text x="32" y="64" font-size="12.5" fill="#4b5665">PCA9555 input registers report the keys. PCA9532 LS registers drive the lamps. Button bit n and LED channel n are the same index.</text>

    <text x="32" y="100" font-size="13.5" font-weight="700" fill="#11161d">Buttons &#8212; PCA9555 input registers, read only. A pressed key drives its bit to 0 and holds it there while the key is down.</text>

    <g font-size="10" fill="#6b7787" text-anchor="middle">
      <text x="243" y="122">bit 7</text><text x="329" y="122">bit 6</text><text x="415" y="122">bit 5</text><text x="501" y="122">bit 4</text>
      <text x="587" y="122">bit 3</text><text x="673" y="122">bit 2</text><text x="759" y="122">bit 1</text><text x="845" y="122">bit 0</text>
    </g>

    <g font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#11161d">
      <text x="32" y="156">0x21 reg 0x00</text>
      <text x="32" y="220">0x21 reg 0x01</text>
      <text x="32" y="284">0x22 reg 0x00</text>
    </g>
    <g font-size="10.5" fill="#6b7787">
      <text x="32" y="172">input port 0</text>
      <text x="32" y="236">input port 1</text>
      <text x="32" y="300">input port 0</text>
    </g>

    <g text-anchor="middle">
      <g fill="#11161d">
        <rect x="200" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="243" y="152" font-size="10.5" font-weight="700">SELECT</text>
        <text x="243" y="165" font-size="10.5" font-weight="700">PROCESS</text>
        <text x="243" y="179" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 7</text>

        <rect x="286" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="329" y="157" font-size="11" font-weight="700">VACUUM</text>
        <text x="329" y="177" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 6</text>

        <rect x="372" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="415" y="157" font-size="12" font-weight="700">F1</text>
        <text x="415" y="177" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 5</text>

        <rect x="458" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="501" y="157" font-size="12" font-weight="700">F2</text>
        <text x="501" y="177" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 4</text>

        <rect x="544" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="587" y="157" font-size="11" font-weight="700">&#8594; RIGHT</text>
        <text x="587" y="177" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 3</text>

        <rect x="630" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="673" y="157" font-size="11" font-weight="700">FWD</text>
        <text x="673" y="177" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 2</text>

        <rect x="716" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="759" y="152" font-size="10.5" font-weight="700">tab &gt; /</text>
        <text x="759" y="165" font-size="10.5" font-weight="700">pg dn</text>
        <text x="759" y="179" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 1</text>

        <rect x="802" y="130" width="86" height="56" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
        <text x="845" y="152" font-size="10.5" font-weight="700">tab &lt; /</text>
        <text x="845" y="165" font-size="10.5" font-weight="700">pg up</text>
        <text x="845" y="179" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 0</text>
      </g>

      <g fill="#11161d">
        <rect x="200" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="243" y="221" font-size="11" font-weight="700">&#8593; UP</text>
        <text x="243" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 15</text>

        <rect x="286" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="329" y="221" font-size="11" font-weight="700">INFO</text>
        <text x="329" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 14</text>

        <rect x="372" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="415" y="221" font-size="11" font-weight="700">START</text>
        <text x="415" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 13</text>

        <rect x="458" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="501" y="221" font-size="11" font-weight="700">STOP</text>
        <text x="501" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 12</text>

        <rect x="544" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="587" y="221" font-size="11" font-weight="700">PAUSE</text>
        <text x="587" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 11</text>

        <rect x="630" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="673" y="221" font-size="11" font-weight="700">&#8592; LEFT</text>
        <text x="673" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 10</text>

        <rect x="716" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="759" y="221" font-size="11" font-weight="700">REV</text>
        <text x="759" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 9</text>

        <rect x="802" y="194" width="86" height="56" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
        <text x="845" y="221" font-size="11" font-weight="700">&#8595; DOWN</text>
        <text x="845" y="241" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED 8</text>
      </g>

      <g>
        <rect x="200" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="243" y="290" font-size="10.5" fill="#79838f">unknown</text>
        <rect x="286" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="329" y="290" font-size="10.5" fill="#79838f">unknown</text>
        <rect x="372" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="415" y="290" font-size="10.5" fill="#79838f">unknown</text>
        <rect x="458" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="501" y="290" font-size="10.5" fill="#79838f">unknown</text>
        <rect x="544" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="587" y="290" font-size="10.5" fill="#79838f">unknown</text>
        <rect x="630" y="258" width="86" height="56" fill="#e8eaed" stroke="#9aa3b0" stroke-width="1.2"/>
        <text x="673" y="290" font-size="10.5" fill="#79838f">unknown</text>

        <rect x="716" y="258" width="86" height="56" fill="#f8e6c0" stroke="#a8761d" stroke-width="1.4"/>
        <text x="759" y="280" font-size="10.5" font-weight="700" fill="#11161d">RUN</text>
        <text x="759" y="293" font-size="10.5" font-weight="700" fill="#11161d">MODE</text>
        <text x="759" y="307" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED ?</text>

        <rect x="802" y="258" width="86" height="56" fill="#f8e6c0" stroke="#a8761d" stroke-width="1.4"/>
        <text x="845" y="280" font-size="10.5" font-weight="700" fill="#11161d">EDIT</text>
        <text x="845" y="293" font-size="10.5" font-weight="700" fill="#11161d">MODE</text>
        <text x="845" y="307" font-size="9.5" font-family="Consolas, monospace" fill="#3d4a59">LED ?</text>
      </g>
    </g>

    <text x="32" y="338" font-size="11" fill="#4b5665">0x22 input port 1 (reg 0x01) never changed during mapping, so all eight of its bits are still unidentified, as are the six grey ones above.</text>

    <text x="32" y="376" font-size="13.5" font-weight="700" fill="#11161d">LEDs &#8212; PCA9532 0x60 LS registers, write. Two bits per channel: 00 off, 01 on, 10 PWM0, 11 PWM1.</text>
    <text x="32" y="396" font-size="11" fill="#4b5665">Field colour repeats the input port whose buttons these lamps belong to, which is the whole finding: channel n is the lamp of 0x21 bit n.</text>

    <g font-size="10" fill="#6b7787" text-anchor="middle">
      <text x="286" y="416">bits 7-6</text><text x="458" y="416">bits 5-4</text><text x="630" y="416">bits 3-2</text><text x="802" y="416">bits 1-0</text>
    </g>

    <g font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#11161d">
      <text x="32" y="450">LS0  0x06</text>
      <text x="32" y="500">LS1  0x07</text>
      <text x="32" y="550">LS2  0x08</text>
      <text x="32" y="600">LS3  0x09</text>
    </g>

    <g text-anchor="middle" fill="#11161d">
      <rect x="200" y="424" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="286" y="442" font-size="11" font-weight="700">ch 3</text>
      <text x="286" y="458" font-size="10" fill="#3d4a59">&#8594; RIGHT</text>
      <rect x="372" y="424" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="458" y="442" font-size="11" font-weight="700">ch 2</text>
      <text x="458" y="458" font-size="10" fill="#3d4a59">FWD</text>
      <rect x="544" y="424" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="630" y="442" font-size="11" font-weight="700">ch 1</text>
      <text x="630" y="458" font-size="10" fill="#3d4a59">tab &gt; / pg dn</text>
      <rect x="716" y="424" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="802" y="442" font-size="11" font-weight="700">ch 0</text>
      <text x="802" y="458" font-size="10" fill="#3d4a59">tab &lt; / pg up</text>

      <rect x="200" y="474" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="286" y="492" font-size="11" font-weight="700">ch 7</text>
      <text x="286" y="508" font-size="10" fill="#3d4a59">SELECT PROCESS</text>
      <rect x="372" y="474" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="458" y="492" font-size="11" font-weight="700">ch 6</text>
      <text x="458" y="508" font-size="10" fill="#3d4a59">VACUUM</text>
      <rect x="544" y="474" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="630" y="492" font-size="11" font-weight="700">ch 5</text>
      <text x="630" y="508" font-size="10" fill="#3d4a59">F1</text>
      <rect x="716" y="474" width="172" height="44" fill="#d6e6f7" stroke="#2f6ea8" stroke-width="1.4"/>
      <text x="802" y="492" font-size="11" font-weight="700">ch 4</text>
      <text x="802" y="508" font-size="10" fill="#3d4a59">F2</text>

      <rect x="200" y="524" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="286" y="542" font-size="11" font-weight="700">ch 11</text>
      <text x="286" y="558" font-size="10" fill="#3d4a59">PAUSE</text>
      <rect x="372" y="524" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="458" y="542" font-size="11" font-weight="700">ch 10</text>
      <text x="458" y="558" font-size="10" fill="#3d4a59">&#8592; LEFT</text>
      <rect x="544" y="524" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="630" y="542" font-size="11" font-weight="700">ch 9</text>
      <text x="630" y="558" font-size="10" fill="#3d4a59">REV</text>
      <rect x="716" y="524" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="802" y="542" font-size="11" font-weight="700">ch 8</text>
      <text x="802" y="558" font-size="10" fill="#3d4a59">&#8595; DOWN</text>

      <rect x="200" y="574" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="286" y="592" font-size="11" font-weight="700">ch 15</text>
      <text x="286" y="608" font-size="10" fill="#3d4a59">&#8593; UP</text>
      <rect x="372" y="574" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="458" y="592" font-size="11" font-weight="700">ch 14</text>
      <text x="458" y="608" font-size="10" fill="#3d4a59">INFO</text>
      <rect x="544" y="574" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="630" y="592" font-size="11" font-weight="700">ch 13</text>
      <text x="630" y="608" font-size="10" fill="#3d4a59">START</text>
      <rect x="716" y="574" width="172" height="44" fill="#d8eedd" stroke="#2f7d55" stroke-width="1.4"/>
      <text x="802" y="592" font-size="11" font-weight="700">ch 12</text>
      <text x="802" y="608" font-size="10" fill="#3d4a59">STOP</text>
    </g>

    <g font-size="11" fill="#4b5665">
      <text x="32" y="646">The mainboard lights a button only while that button is a legal input, so an LS write is a live list of the commands the machine will accept.</text>
      <text x="32" y="666">Control byte bit 4 is auto-increment, so LS0 through LS3 can be written in one transaction. Sources: docs/button_map.json, docs/led_map.json.</text>
    </g>
  </g>
</svg>
